[package]
name = "legendary-desktop"
version = "0.3.0"
description = "Legendary desktop game library"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77.2"

[features]
embedded-sidecar = ["legendary-transport/embedded-sidecar"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
legendary-transport = { path = "transport" }
open = "5"
tauri-plugin-dialog = "2"

[workspace]
members = ["transport"]
resolver = "2"
